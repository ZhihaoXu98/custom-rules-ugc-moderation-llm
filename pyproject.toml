[project]
name = "moderation-llm"
version = "0.1.0"
description = "Custom-rules UGC moderation LLM (Qwen 2.5 7B fine-tune)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "datasets==4.8.5",
  "openai==2.37.0",
  "anthropic==0.103.1",
  "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
  "ruff==0.15.13",
  "mypy==2.1.0",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=src --cov-report=term-missing"
